# Vibebara 后端联调编排（cloud 后端 + MySQL）
#
# 用法：
#   1. 生成密钥并写入同目录 .env：
#        echo "JWT_SECRET=$(python -c 'import secrets;print(secrets.token_urlsafe(48))')" >> .env
#      （Windows PowerShell 见 README/对话说明）
#   2. docker compose up -d --build
#   3. 验证：curl http://localhost:8000/health
#
# 说明：WS 为进程内内存态，backend 固定单进程，请勿对 backend 做 scale/replicas。
services:
  mysql:
    image: mysql:8.0
    # --skip-name-resolve：禁用对客户端 IP 的反向 DNS 解析。容器网络下反向 DNS
    #   通常不可用，MySQL 每次新建连接都会等待解析超时（约 4~5s），导致每个需要
    #   建连的后端请求恒定慢 ~4.6s。禁用后按 IP 鉴权，建连耗时降到毫秒级。
    command: >-
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --skip-name-resolve
    environment:
      MYSQL_DATABASE: ${DB_NAME:-cowork}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_USER: ${DB_USER:-cowork}
      MYSQL_PASSWORD: ${DB_PASSWORD:-coworkpass}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${MYSQL_ROOT_PASSWORD:-rootpass}"]
      interval: 5s
      timeout: 5s
      retries: 20
    # 默认不对外暴露 3306（仅容器网络内访问）；需本机连库调试再放开：
    # ports:
    #   - "3306:3306"

  backend:
    build:
      context: ./backend
    environment:
      DEPLOYMENT_MODE: cloud
      DEBUG: "false"
      HOST: 0.0.0.0
      PORT: "8000"
      DATABASE_URL: mysql+aiomysql://${DB_USER:-cowork}:${DB_PASSWORD:-coworkpass}@mysql:3306/${DB_NAME:-cowork}?charset=utf8mb4
      DB_AUTO_CREATE: "true"
      # 必填：高熵签名密钥。未设置则启动失败（防止误用开发默认密钥）。
      JWT_SECRET: ${JWT_SECRET:?请在同目录 .env 设置 JWT_SECRET}
      # Electron file:// 请求的 Origin 为 null；Web 域名需在 .env 以 JSON 数组显式加入。
      ALLOWED_ORIGINS: '${ALLOWED_ORIGINS:-["null"]}'
      ALLOW_ORIGIN_REGEX: '${ALLOW_ORIGIN_REGEX:-}'
      # cloud 模式禁止创建已公开弱口令的 DAIL/DAIL2 预设账号。
      SEED_USERS_ENABLED: "false"
      # 注册邀请码：测试版收口注册入口（默认开启）。
      # 签发：docker compose exec backend python scripts/generate_invites.py -n 10
      INVITE_CODE_REQUIRED: ${INVITE_CODE_REQUIRED:-true}
      # 滑块人机验证：登录/注册必须先通过滑块拼图（默认开启）。
      CAPTCHA_REQUIRED: ${CAPTCHA_REQUIRED:-true}
      # 邀请码管理端点的管理员用户名白名单（JSON 数组）
      ADMIN_USERNAMES: '${ADMIN_USERNAMES:-[]}'
      MARKET_SEED_REVIEWERS: '${MARKET_SEED_REVIEWERS:-[]}'
      # 对象存储后端：Skill 持久化改用腾讯云 COS（不再用本地磁盘卷）。
      # 详见 docs/design/cos-storage.md。密钥务必经 .env 注入，勿入 git。
      # 凭证非 compose 级强制：STORAGE_BACKEND=cos 时由后端 CosObjectStore 启动校验
      # 并给出清晰报错；STORAGE_BACKEND=local 时无需 COS 凭证即可启动。
      STORAGE_BACKEND: ${STORAGE_BACKEND:-cos}
      COS_BUCKET: ${COS_BUCKET:-vibebara-prod-1327732770}
      COS_REGION: ${COS_REGION:-ap-chengdu}
      COS_SECRET_ID: ${COS_SECRET_ID:-}
      COS_SECRET_KEY: ${COS_SECRET_KEY:-}
      COS_PREFIX: ${COS_PREFIX:-}
      # 大模型接口：默认走阿里云百炼（DashScope 兼容模式）。base_url/model 有默认值，
      # 仅 LLM_API_KEY 必须经 .env 注入（敏感，勿写默认值/勿入 git）；留空则 LLM 功能
      # （标签分类 / 字段补齐）静默跳过，不影响其它功能。
      LLM_PROVIDER: ${LLM_PROVIDER:-bailian}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-qwen-plus}
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql-data:
