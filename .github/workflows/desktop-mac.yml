name: macOS Desktop Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (major.minor.patch)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: macos-desktop-artifact
  cancel-in-progress: false

jobs:
  build-artifact:
    name: Build arm64 update artifact
    runs-on: macos-15
    timeout-minutes: 90
    environment: macos-cos-release
    env:
      VIBEBARA_UPDATE_URL: ${{ vars.VIBEBARA_UPDATE_URL }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate release input and environment
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::version must use major.minor.patch, for example 1.5.0"
            exit 2
          }
          [[ "$(uname -m)" == "arm64" ]] || {
            echo "::error::This workflow requires an Apple Silicon arm64 runner."
            exit 1
          }
          [[ -n "$VIBEBARA_UPDATE_URL" ]] || {
            echo "::error::Missing GitHub Environment value: VIBEBARA_UPDATE_URL"
            exit 1
          }
          [[ "$VIBEBARA_UPDATE_URL" == https://* ]] || {
            echo "::error::VIBEBARA_UPDATE_URL must use HTTPS."
            exit 1
          }

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: |
            local-core/package-lock.json
            cli/package-lock.json
            local-agent/package-lock.json
            frontend/package-lock.json
            desktop/package-lock.json

      - name: Install Node.js dependencies
        shell: bash
        run: |
          set -euo pipefail
          for workspace in local-core cli local-agent frontend desktop; do
            echo "::group::npm ci ($workspace)"
            npm ci --prefix "$workspace" --loglevel=error
            echo "::endgroup::"
          done

      - name: Build unsigned macOS update artifact
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          chmod +x build-desktop-mac.sh
          ./build-desktop-mac.sh \
            --unsigned-dist \
            --prepare-update \
            --version "$RELEASE_VERSION"

      - name: Upload macOS release artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VBB-mac-${{ inputs.version }}-arm64
          path: |
            desktop/release-mac/*.dmg
            desktop/release-mac/*.zip
            desktop/release-mac/*.blockmap
            desktop/release-mac/latest-mac.yml
          if-no-files-found: warn
          retention-days: 14

      - name: Write release summary
        if: always()
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          {
            echo "## macOS desktop release"
            echo
            echo "- Status: ${{ job.status }}"
            echo "- Version: \`$RELEASE_VERSION\`"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Architecture: \`arm64\`"
            echo "- Update URL: \`${VIBEBARA_UPDATE_URL%/}/\`"
            echo
            echo "> Download this unsigned artifact and publish it from a domestic machine."
          } >> "$GITHUB_STEP_SUMMARY"
