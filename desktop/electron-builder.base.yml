appId: com.vibebara.desktop
productName: Vibebara

directories:
  output: release
  buildResources: build

electronLanguages:
  - en-US
  - zh-CN

compression: maximum
asar: true

# local-agent 通过 ELECTRON_RUN_AS_NODE=1 复用 Electron 内置 Node。
electronFuses:
  runAsNode: true
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  grantFileProtocolExtraPrivileges: false

files:
  - dist-electron/**/*
  - package.json
