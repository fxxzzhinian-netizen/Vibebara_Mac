# Vibebara 桌面壳打包配置（方案 B M5-c 脚手架，Windows-first）。
#
# 开发解包使用本文件；正式签名发布由 electron-builder.release.yml 继承并收紧。

appId: com.vibebara.desktop
productName: Vibebara
directories:
  output: release
  buildResources: build

# 只保留中英文 Electron 语言包，删除其余 ~50 个 locales/*.pak（约省 38MB 解包体积）。
# en-US 是 Electron 的兜底语言，删除会导致界面字体异常，必须保留。
# electron-builder 24.2.0+ 起该全局选项已支持 Windows/Linux。
electronLanguages:
  - en-US
  - zh-CN

# 安装包采用最大压缩（NSIS/LZMA）。仅影响安装包体积与打包耗时，不影响安装后体积。
compression: maximum
asar: true

# 关闭可绕过应用边界的 Electron 启动入口，并要求只从完整 ASAR 加载应用代码。
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  grantFileProtocolExtraPrivileges: false

# 把本地代理与前端构建产物打进安装包（packaged 时主进程从 process.resourcesPath 解析）。
extraResources:
  - from: ../local-agent/dist
    to: local-agent/dist
    filter: ["**/*"]
  # 仅打入 local-agent 的生产依赖（ws / js-yaml / argparse），不要整个 node_modules
  # （含 vite/vitest/typescript 等 ~50MB 开发工具链）。新增运行时依赖时需在此补充。
  - from: ../local-agent/node_modules/ws
    to: local-agent/node_modules/ws
    filter: ["**/*"]
  - from: ../local-agent/node_modules/js-yaml
    to: local-agent/node_modules/js-yaml
    filter: ["**/*"]
  - from: ../local-agent/node_modules/argparse
    to: local-agent/node_modules/argparse
    filter: ["**/*"]
  # local-agent 与 CLI 共用的文件/hash 内核（file: 依赖不会随上面三方依赖自动打包）。
  - from: ../local-core
    to: local-agent/node_modules/@vibebara/local-core
    filter:
      - package.json
      - dist/**/*
  - from: ../local-agent/package.json
    to: local-agent/package.json
  - from: ../frontend/dist
    to: frontend/dist
    filter: ["**/*"]

files:
  - dist-electron/**/*
  - package.json

win:
  icon: build/icon.ico
  target:
    - nsis

# 覆盖升级机制：appId 固定（com.vibebara.desktop）→ 安装器用其派生的 GUID 在注册表里
# 识别"这台机器上已装的 Vibebara"。只要本次打包的版本号高于已装版本，运行安装包时会
# 自动卸掉旧版、装到同一目录，用户无需先手动卸载。（首次安装才会建目录；升级时跳过选目录页、
# 沿用原安装位置。）配套前提：每次打包用递增的版本号——见 build-desktop.ps1 的 Set-DesktopBuildVersion。
nsis:
  oneClick: false                           # 带"下一步"的精简向导；想要全自动零点击升级可改成 true
  perMachine: false                         # 装到当前用户（%LOCALAPPDATA%\Programs\Vibebara），免管理员
  allowToChangeInstallationDirectory: false # 锁定安装目录，避免装到不同目录产生重复副本
  deleteAppDataOnUninstall: false           # 升级时静默卸旧版并保留用户数据

# 正式发布配置、强制签名和 generic 更新元数据见 electron-builder.release.yml。
